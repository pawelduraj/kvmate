<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kvmate</title>
  <link rel="stylesheet" href="shared/base.css">
  <link rel="stylesheet" href="panel/panel.css">
  <script type="module" src="panel/panel.js" blocking="render"></script>
</head>
<body>
  <div id="panel">
    <header>
      <svg class="logo" width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1F2A37"/><rect x="5" y="8" width="10" height="7" rx="1.5" fill="#2F7DE1"/><rect x="18" y="9" width="9" height="6" rx="1.2" fill="#2FA36B"/><path d="M17 16.5h11" stroke="#2FA36B" stroke-width="1.5"/><path d="M10 15v7h12.5v-5" stroke="#AFC3D6" stroke-width="1.5" fill="none"/></svg>
      <span class="title"><b>kvmate</b><span id="state" class="state"><i></i><span id="state-text">…</span></span></span>
      <span class="grow"></span>
      <button id="open" class="small" title="Open the kvmate window">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="1.5"/><path d="M3 7.5h14"/></svg>
        Open kvmate
      </button>
    </header>

    <div id="banner" class="banner" hidden>
      <b id="banner-title"></b>
      <span id="banner-text"></span>
      <button id="banner-action" class="small light" hidden></button>
    </div>

    <section id="main-view">
      <div class="targets" role="group" aria-label="Keyboard and mouse">
        <button id="t-here" class="target" data-target="pc">
          <svg width="24" height="24" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="10" rx="1.5"/><path d="M7 17h6M10 13.5V17"/></svg>
          <span><b>This computer</b><small id="t-here-sub"></small></span>
        </button>
        <button id="t-other" class="target" data-target="laptop">
          <svg width="24" height="24" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4" y="4.5" width="12" height="8.5" rx="1.2"/><path d="M2 15.5h16"/></svg>
          <span><b>Other computer</b><small id="t-other-sub"></small></span>
        </button>
      </div>

      <div id="rows" class="rows"></div>
    </section>

    <section id="sub-view" hidden>
      <button id="back" class="back">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5l-5 5 5 5"/></svg>
        <span id="sub-title"></span>
      </button>
      <div id="sub-body"></div>
    </section>

    <footer>
      <span id="foot"></span>
      <button id="quit" class="small">Quit</button>
    </footer>
  </div>
</body>
</html>
