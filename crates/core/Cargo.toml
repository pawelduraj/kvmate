[package]
name = "kvmate-core"
description = "kvmate core: link to the board, switching, input capture, sound (everything but the GUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["audio-devices"]
audio-devices = ["dep:cpal"]

[dependencies]
cpal = { version = "0.18.2", optional = true }
espflash = { version = "4.3.0", default-features = false, features = ["serialport"] }
getrandom = "0.3"
if-addrs = "0.13"
kvmate-protocol.workspace = true
rubato = "4.0.0"
serde = { version = "1", features = ["derive"] }
serialport = "4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
