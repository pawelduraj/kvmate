language = "C"
pragma_once = true
autogen_warning = "/* Generated by `cargo xtask gen-header` from crates/protocol. Do not edit by hand. */"
no_includes = true
sys_includes = ["stdint.h", "stddef.h"]
documentation = true
documentation_style = "c99"
usize_is_size_t = true
cpp_compat = true

[export]
prefix = "PROTOCOL_"
renaming_overrides_prefixing = true
include = []

[export.rename]
PROTOCOL_VERSION = "PROTOCOL_VERSION"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[layout]
packed = "__attribute__((packed))"

[parse]
parse_deps = false
